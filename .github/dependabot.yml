version: 2
# Keeps the site's dependencies and its pinned actions moving without anyone
# watching. Solo repo: majors arrive as their own PR to be read, patches and
# minors are grouped so there is one review, not twenty.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: deps
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: ["minor", "patch"]
      development-minor-patch:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    rebase-strategy: auto
    commit-message:
      prefix: ci
    groups:
      # Without `update-types` the group swallows majors too, and a grouped PR
      # reports only its highest bump. One major in the group then makes the
      # whole thing `semver-major`, which the auto-merge refuses - so the pinned
      # SHAs would never refresh. Group the safe changes; let a major arrive on
      # its own where a human reads it.
      actions-patch-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
