name: Dependabot auto-merge

# Dependabot-triggered `pull_request` workflows receive a READ-ONLY
# GITHUB_TOKEN no matter what `permissions:` says, so a merge attempted there
# cannot work. `pull_request_target` runs in the base-branch context with a
# writable token.
#
# That event is the well-known "pwn request" vector, and it is safe here for one
# reason only: this workflow never checks out, builds, or executes the pull
# request's code. It reads PR metadata and calls the API. If a checkout of
# `github.event.pull_request.head` is ever added here, delete this workflow
# instead - the trade stops being safe at that moment.
#
# Merges only bumps that cannot change behaviour unread:
#   npm patch             - always
#   npm minor, dev only   - always (lint/test tooling)
#   npm minor, production - never, read it
#   npm major             - never, read it
#   actions any           - always (CI runs the pages actions too)
#
# `main` has no branch protection on purpose: the daily refresh pushes the
# snapshot straight to it, and a required-check ruleset would reject that push
# and silently stop the site updating. So the wait for CI is explicit below.
on: pull_request_target

permissions:
  # Least privilege for the read-only work; the job adds the two writes it needs.
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: What is being bumped?
        id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether it may merge unread
        id: decide
        env:
          ECO: ${{ steps.meta.outputs.package-ecosystem }}
          UPDATE: ${{ steps.meta.outputs.update-type }}
          DEP: ${{ steps.meta.outputs.dependency-type }}
        run: |
          allowed=no
          # Action bumps of any size: the only extra risk a major adds over a
          # patch is API incompatibility, and CI now runs the pages actions as
          # well as the build. Upstream integrity is already assumed for patch
          # bumps, so refusing majors would not buy anything.
          if [ "$ECO" = "github_actions" ]; then allowed=yes; fi
          # npm is different: a major can change runtime behaviour without
          # failing a build, so it still needs a reader.
          case "$UPDATE" in
            version-update:semver-patch) allowed=yes ;;
            version-update:semver-minor)
              if [ "$DEP" = "direct:development" ]; then allowed=yes; fi ;;
          esac
          echo "Allowed to auto-merge: $allowed (ecosystem=$ECO update=$UPDATE dependency=$DEP)"
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: Wait for CI, then merge only if it passed
        if: steps.decide.outputs.allowed == 'yes'
        env:
          # A pull request that edits .github/workflows/ can only be merged by a
          # token holding the `workflows` scope. GITHUB_TOKEN never has it and
          # the scope cannot be granted through the `permissions:` key, so an
          # optional PAT (contents, pull-requests, workflows: write) fills in.
          # Dependency bumps to package.json do not need it.
          PAT: ${{ secrets.AUTOMERGE_TOKEN }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # This workflow is itself a check on the pull request, so
          # `gh pr checks --watch` would sit waiting on its own pending job
          # forever - a deadlock, not a wait. Poll instead and ignore this
          # job's own check. Fail closed on the deadline: a bump that never
          # got proven stays open rather than merging unproven.
          deadline=$((SECONDS + 1200))
          verdict=WAIT
          while [ "$SECONDS" -lt "$deadline" ]; do
            verdict=$(gh pr checks "$PR" --repo "$REPO" --json name,bucket --jq '
              [.[] | select(.name != "auto-merge")]
              | if length == 0 then "WAIT"
                elif any(.[]; .bucket == "fail" or .bucket == "cancel") then "FAIL"
                elif any(.[]; .bucket == "pending") then "WAIT"
                else "PASS" end' 2>/dev/null || echo WAIT)
            echo "checks: $verdict"
            if [ "$verdict" = "PASS" ]; then break; fi
            if [ "$verdict" = "FAIL" ]; then
              echo "CI did not pass; leaving this pull request open."
              exit 1
            fi
            sleep 20
          done
          if [ "$verdict" != "PASS" ]; then
            echo "Timed out waiting for checks; leaving this pull request open."
            exit 1
          fi

          if [ -z "$PAT" ]; then
            touches=$(gh pr view "$PR" --repo "$REPO" --json files \
              --jq '[.files[].path | select(startswith(".github/workflows/"))] | length')
            if [ "$touches" != "0" ]; then
              echo "This pull request edits .github/workflows/, and GITHUB_TOKEN"
              echo "cannot merge those. Add a fine-grained PAT with contents,"
              echo "pull-requests and workflows write as AUTOMERGE_TOKEN to make"
              echo "action bumps merge themselves. Checks passed; only the merge"
              echo "step is withheld."
              exit 0
            fi
          fi

          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
