name: Dependabot auto-merge

# Dependabot-triggered `pull_request` workflows receive a READ-ONLY
# GITHUB_TOKEN no matter what `permissions:` says, so a merge attempted there
# cannot work. `pull_request_target` runs in the base-branch context with a
# writable token.
#
# That event is the well-known "pwn request" vector, and it is safe here for one
# reason only: this workflow never checks out, builds, or executes the pull
# request's code. It reads PR metadata and calls the API. If a checkout of
# `github.event.pull_request.head` is ever added here, delete this workflow
# instead - the trade stops being safe at that moment.
#
# Merges only bumps that cannot change behaviour unread:
#   npm patch             - always
#   npm minor, dev only   - always (lint/test tooling)
#   npm minor, production - never, read it
#   npm major             - never, read it
#   actions patch/minor   - always
#
# `main` has no branch protection on purpose: the daily refresh pushes the
# snapshot straight to it, and a required-check ruleset would reject that push
# and silently stop the site updating. So the wait for CI is explicit below.
on: pull_request_target

permissions:
  # Least privilege for the read-only work; the job adds the two writes it needs.
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: What is being bumped?
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether it may merge unread
        id: decide
        env:
          ECO: ${{ steps.meta.outputs.package-ecosystem }}
          UPDATE: ${{ steps.meta.outputs.update-type }}
          DEP: ${{ steps.meta.outputs.dependency-type }}
        run: |
          allowed=no
          case "$ECO:$UPDATE" in
            github-actions:version-update:semver-patch) allowed=yes ;;
            github-actions:version-update:semver-minor) allowed=yes ;;
          esac
          case "$UPDATE" in
            version-update:semver-patch) allowed=yes ;;
            version-update:semver-minor)
              if [ "$DEP" = "direct:development" ]; then allowed=yes; fi ;;
          esac
          echo "Allowed to auto-merge: $allowed (ecosystem=$ECO update=$UPDATE dependency=$DEP)"
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: Wait for CI, then merge only if it passed
        if: steps.decide.outputs.allowed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # CI starts at the same moment as this workflow. Reading checks before
          # it has registered would say "no checks reported" and merge unproven
          # code, so wait for the run to exist first.
          for attempt in $(seq 1 40); do
            status=$(gh run list --repo "$REPO" --workflow CI --branch "$HEAD_REF" \
              --limit 1 --json status --jq '.[0].status // empty')
            if [ -n "$status" ]; then
              echo "CI run is $status"
              break
            fi
            echo "waiting for the CI run to register ($attempt/40)"
            sleep 15
          done
          gh pr checks "$PR" --repo "$REPO" --watch --fail-fast --interval 15
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
