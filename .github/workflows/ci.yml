name: CI

# Runs the same gates the deploy runs, on every pull request. Dependabot opens
# these, so a dependency bump is proven before it can reach main. This uses
# `pull_request`, never `pull_request_target`: fork PRs get no secrets, so this
# workflow cannot be used to read them.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Static checks
        run: node scripts/verify/static.mjs

      - name: Snapshot invariants
        run: node scripts/verify/snapshot.mjs

      # Builds the export and serves it; also asserts the export size and that
      # the RSC payload prune ran.
      - name: Serve the export and check it
        run: node scripts/verify/app-smoke.mjs

      - name: SEO surfaces
        run: node scripts/verify/seo.mjs

      - name: Automation and hosting config
        run: node scripts/verify/automation.mjs

      - name: Security posture
        run: node scripts/verify/security.mjs

      - name: Docs tree
        run: node scripts/verify/dox.mjs

  # The deploy half of the pipeline, which the `verify` job never touches.
  # Without this, a bump of `configure-pages` / `upload-pages-artifact` /
  # `deploy-pages` is only exercised when it reaches main, so an action major
  # would be merged on the strength of checks that never ran it. This job runs
  # the real pages actions against the real export and never deploys.
  pages-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write # configure-pages reads the site configuration
      id-token: write # upload-pages-artifact expects the deploy token shape
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the export
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
