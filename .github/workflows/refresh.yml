name: Refresh Heretic index

on:
  schedule:
    # Daily, off-peak UTC. GitHub disables scheduled workflows in a public
    # repository after 60 days without repository activity, so the bot commit
    # below is also what keeps this schedule alive.
    - cron: "17 3 * * *"
  workflow_dispatch:
  # Any push that touches the pipeline must pass the same gates before it can
  # reach the live site, otherwise a bad deploy ships from the main branch.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "data/snapshot.json"
      - "public/**"
      - "package.json"
      - "next.config.ts"
      - ".github/workflows/refresh.yml"

# Least privilege: read by default, and each job asks for only what it uses.
permissions:
  contents: read

# One refresh at a time. A slow run must not be cancelled mid-write, or the
# snapshot is committed half-built.
concurrency:
  group: refresh-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # commits the refreshed snapshot back to main
      pages: write # configure-pages / upload-pages-artifact
      id-token: write # deploy-pages provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Card texts keyed by repo id + commit sha. The run-id key makes every run
      # a fresh entry, restored from the newest matching prefix below, which is
      # what makes the crawl incremental: unchanged repos are never refetched.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/cache
          key: heretic-cache-${{ github.run_id }}
          restore-keys: |
            heretic-cache-

      - name: Unit and integration tests
        run: npm test

      - name: Static checks
        run: node scripts/verify/static.mjs

      # An expired or revoked token makes every README fetch 401, which reads as
      # "this repo has no card" rather than an error. Fail here with the reason
      # instead of letting the index quietly shrink.
      - name: Is HF_TOKEN still valid?
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is not set. The crawl would be rate-limited and drop repos."
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/models?limit=1")
          echo "Hugging Face auth check: HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::HF_TOKEN is rejected by the Hugging Face API (HTTP $status). Rotate the secret."
            exit 1
          fi

      # The crawl is the only step that touches the network, so it is the only
      # step that can hang or be rate-limited. Every request has a timeout and
      # bounded retries inside scripts/lib/hf.ts.
      - name: Crawl Hugging Face
        id: crawl
        run: npm run crawl
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        continue-on-error: true

      - name: Crawl succeeded?
        if: steps.crawl.outcome == 'failure'
        run: |
          echo "::error::The crawl failed. The committed snapshot is still valid, so" \
               "this run stops here and the site stays on the last good data."
          exit 1

      - name: Build snapshot
        run: npm run snapshot

      # The README states the size of the index. It is generated from the
      # snapshot so it cannot drift; this rewrites it before the commit.
      - name: Update README counts
        run: npm run counts

      - name: Validate snapshot
        run: node scripts/verify/snapshot.mjs

      # This build is what gets served. GitHub Pages has no build step of its
      # own, so the artifact uploaded below is the live site.
      - name: Build the site
        run: npm run build

      - name: Serve the export and check it
        run: node scripts/verify/app-smoke.mjs

      - name: Security posture
        run: node scripts/verify/security.mjs

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # public/.nojekyll and public/CNAME reach out/ because Next copies public/
      # verbatim. Without .nojekyll, Pages runs Jekyll and silently drops the
      # _next/ directory, which serves a blank page with no error anywhere.
      - name: Upload the export
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

      - name: Commit refreshed snapshot
        id: commit
        run: |
          git config user.name "heretic-index-bot"
          git config user.email "actions@users@github.com"
          # public/og.png is regenerated from the snapshot by `npm run build`, so
          # it is committed with it. Leaving it out lets the committed card drift
          # away from the counts the site actually shows.
          git add data/snapshot.json public/llms.txt public/og.png README.md
          # updatedAt is stamped with the crawl time on every run, so on its own
          # it makes the diff always non-empty. Compare everything else.
          if node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            const strip = (t) => t.replace(/"updatedAt":"[^"]*"/, "\"updatedAt\":\"\"");
            const before = strip(execSync("git show HEAD:data/snapshot.json", { encoding: "utf8", maxBuffer: 1 << 28 }));
            const after = strip(fs.readFileSync("data/snapshot.json", "utf8"));
            let ogBefore = null;
            try {
              ogBefore = execSync("git show HEAD:public/og.png", { encoding: "base64", maxBuffer: 1 << 26 });
            } catch {
              // First run: no card in HEAD yet.
            }
            const ogAfter = fs.readFileSync("public/og.png").toString("base64");
            process.exit(before === after && ogBefore === ogAfter ? 0 : 1);
          '; then
            echo "Snapshot unchanged; nothing to commit."
          else
            git commit -m "Refresh Heretic snapshot"
            # A push can be rejected if the branch moved while this ran. The
            # concurrency group stops two refreshes racing, but a human commit
            # still can. Report it instead of failing the whole run.
            if ! git push; then
              echo "::error::Could not push the refreshed snapshot. The next run will retry."
            fi
          fi

  # Pages publishes the artifact the refresh job uploaded. It runs only when the
  # build and the gates above succeeded, so a failed crawl leaves the previous
  # deployment serving rather than publishing a half-built one.
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Both this and the schedule exist because the two failure modes are different:
  # the schedule dies after 60 days without a commit, and a green refresh says
  # nothing about whether the deploy reached the public site.
  verify-freshness:
    needs: [refresh, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: How old is the committed snapshot?
        run: |
          node -e '
            const fs = require("fs");
            const snap = JSON.parse(fs.readFileSync("data/snapshot.json", "utf8"));
            const ageDays = (Date.now() - Date.parse(snap.updatedAt)) / 86400000;
            console.log(`snapshot updatedAt: ${snap.updatedAt} (${ageDays.toFixed(1)} days old)`);
            if (ageDays > 3) {
              console.log(`::warning::Snapshot is ${ageDays.toFixed(1)} days old. The refresh job may be failing.`);
            }
          '

      # A green refresh proves the snapshot is fresh in git. It says nothing
      # about the deployed site: on 2026-10-20 the pipeline succeeded daily for
      # twelve days while the live site stayed frozen, and nothing failed.
      - name: Is the live site serving the committed snapshot?
        run: |
          node -e '
            const fs = require("fs");
            const site = "https://hdir.sdad.pro/data/index.json";
            const committed = JSON.parse(fs.readFileSync("data/snapshot.json", "utf8"));
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            (async () => {
              // Pages takes a moment to serve a fresh deployment, and the edge
              // caches /data for a few minutes, so one fetch can read the
              // previous deployment. Re-check before calling it stale.
              for (let attempt = 1; attempt <= 4; attempt += 1) {
                try {
                  const response = await fetch(site, { cache: "no-store" });
                  if (!response.ok) throw new Error(`HTTP ${response.status}`);
                  const live = await response.json();
                  const lag =
                    (Date.parse(committed.updatedAt) - Date.parse(live.updatedAt)) / 86400000;
                  console.log(`committed ${committed.updatedAt} | live ${live.updatedAt} | ${lag.toFixed(2)} days behind`);
                  if (lag <= 1) {
                    console.log("Live site is in step with the committed snapshot.");
                    return;
                  }
                } catch (error) {
                  console.log(`attempt ${attempt}: ${error.message}`);
                }
                if (attempt < 4) await sleep(30000);
              }
              console.log(
                "::error::The live site is more than a day behind the committed snapshot. " +
                  "The pipeline is green, so this is the deploy not reaching GitHub Pages: " +
                  "check the Pages deployment and the custom domain."
              );
              process.exit(1);
            })();
          '

  # Silence is the failure mode that cost twelve days. A failed run is a red
  # check nobody is watching at 03:17, so it also opens an issue: that emails
  # the maintainer and leaves a record that survives the run's log.
  notify-failure:
    needs: [refresh, deploy, verify-freshness]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open (or keep) a failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error::The daily Heretic refresh failed. See $RUN_URL"
          gh label create refresh-failure --repo "$REPO" --color B60205 \
            --description "The daily Heretic refresh is failing" --force
          open=$(gh issue list --repo "$REPO" --label refresh-failure --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "Issue #$open is already open; not filing a duplicate."
            exit 0
          fi
          gh issue create --repo "$REPO" --label refresh-failure \
            --title "Daily refresh failed" \
            --body "$(printf '%s\n' \
              'The scheduled Heretic refresh did not complete. The site is still serving the last good snapshot, so nothing is lost.' \
              '' \
              "Run: $RUN_URL" \
              '' \
              'Common causes: `HF_TOKEN` expired or revoked, a Hugging Face rate limit, or a gate rejecting the refreshed snapshot. The step that failed names the reason.' \
              '' \
              'This issue closes itself on the next successful run.')"

  # The other half of the loop: when a run succeeds, the failure issue goes away,
  # so an open issue always means "broken right now" and never "fixed months ago".
  notify-recovered:
    needs: [refresh, deploy, verify-freshness]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close any open failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --repo "$REPO" --label refresh-failure --state open \
            --limit 20 --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$REPO" \
              --comment "Recovered: $RUN_URL"
            echo "Closed issue #$n"
          done
