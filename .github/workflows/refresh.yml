name: Refresh Heretic index

on:
  schedule:
    # Daily, off-peak UTC. GitHub may delay scheduled runs under load.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Card texts keyed by repo id + commit sha (~30 MB at 8k repos, the
      # markdown dominates). The run-id key makes every day a fresh entry,
      # restored from the newest matching prefix below. This is what makes the
      # crawl incremental: unchanged repos are never fetched again.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: heretic-cache-${{ github.run_id }}
          restore-keys: |
            heretic-cache-

      - name: Unit and integration tests
        run: npm test

      - name: Static checks
        run: node scripts/verify/static.mjs

      - name: Crawl Hugging Face
        run: npm run crawl
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Build snapshot
        run: npm run snapshot

      - name: Validate snapshot
        run: node scripts/verify/snapshot.mjs

      - name: Build the site
        run: npm run build

      - name: Commit refreshed snapshot
        run: |
          git config user.name "heretic-index-bot"
          git config user.email "actions@users@github.com"
          git add data/snapshot.json
          # updatedAt is stamped with the crawl time on every run, so on its own
          # it makes the diff always non-empty. Compare everything else, or a
          # day with no new repo redeploys 600 MB of identical HTML.
          if node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            const strip = (t) => t.replace(/"updatedAt":"[^"]*"/, "\"updatedAt\":\"\"");
            const before = strip(execSync("git show HEAD:data/snapshot.json", { encoding: "utf8", maxBuffer: 1 << 28 }));
            const after = strip(fs.readFileSync("data/snapshot.json", "utf8"));
            process.exit(before === after ? 0 : 1);
          '; then
            echo "Snapshot unchanged"
          else
            git commit -m "Refresh Heretic snapshot"
            git push
          fi
