[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# The site moved from heretico.sdad.pro to hdir.sdad.pro. Redirects only fire
# for a domain attached to this site, so the old name must be added back under
# Domain management for these to take effect; unattached, it returns 404.
[[redirects]]
  from = "https://heretico.sdad.pro/*"
  to = "https://hdir.sdad.pro/:splat"
  status = 301
  force = true

# HTML is rebuilt on every snapshot commit, so revalidate rather than serve a
# stale leaderboard to a crawler or an assistant.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The browser index changes once a day. An hour of caching would let an
# assistant answer from yesterday's ranking, so keep it short and revalidate.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Content-addressed build output: never changes for a given URL.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
